name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
      - master
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure Git credentials
          git config --global user.email "deploy-action@github.com"
          git config --global user.name "GitHub Deploy Action"
          
          # Add the Hugging Face Space git remote as 'hf'
          # REPLACE 'YOUR_HF_USERNAME' AND 'YOUR_SPACE_NAME' in your repository!
          # For example, if your username is 'sadeep' and space is 'ceylon-gold-rate':
          # git remote add hf https://sadeep:$HF_TOKEN@huggingface.co/spaces/sadeep/ceylon-gold-rate
          
          git remote add hf https://YOUR_HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/YOUR_HF_USERNAME/YOUR_SPACE_NAME
          
          # Force push the main branch to the Hugging Face Space
          git push --force hf HEAD:main
